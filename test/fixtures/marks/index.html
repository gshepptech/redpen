<!doctype html>
<meta charset="utf-8">
<title>Filled mark beside stroked icons</title>
<style>
  html { overflow-x: clip; }
  body { margin: 0; color: #16161a; background: #fdfcfb; font: 16px/1.5 system-ui; }
  .path { font-family: ui-monospace, monospace; font-size: 12px; color: #55555f; }
  li { list-style: none; }
</style>
<!-- A filled brand mark draws no stroke, so its computed stroke-width is the
     SVG initial 1 — a value nobody authored. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-label="Mark">
  <path d="M4 4h16v16H4z"/>
</svg>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-label="Search">
  <circle cx="11" cy="11" r="7"/>
</svg>
<ul>
  <li><span class="path">internal/payments/refund.go</span></li>
  <li><span class="path">internal/payments/refund.go</span></li>
  <li><span class="path">internal/payments/refund.go</span></li>
</ul>
<p>A real sentence of prose so the page has some actual copy on it. It runs long enough to read as prose rather than as a label.</p>
