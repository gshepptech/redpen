<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The tells above gate forty</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner"><span class="mark">Ridgeline</span></header>

  <main id="main">
    <!-- gate 55: uppercase display below line-height 1.0 -->
    <h1 class="shout">RIDGELINE SURVEY, SECOND EDITION</h1>

    <!-- gate 51: an unbreakable word at display size, no overflow-wrap -->
    <h2 class="display">Counter-intelligence-briefing</h2>

    <!-- gate 56: a second sticky pinned to the same strip as the banner -->
    <div class="toolbar">Filters</div>

    <!-- gate 50: an image in a bare 1fr track -->
    <section class="plates">
      <figure><img src="plate.svg" alt="A survey plate" width="1200" height="600"></figure>
      <figure><img src="plate.svg" alt="A second plate" width="1200" height="600"></figure>
    </section>

    <!-- gate 47: a window frame built out of divs -->
    <div class="fake-window">
      <div class="fake-bar">
        <span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span>
      </div>
      <pre class="fake-body">$ survey --county centre</pre>
    </div>
  </main>
</body>
</html>
