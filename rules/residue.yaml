# What the process that built it left behind.
#
# Nothing here is about the software. It is about the machinery that produced
# it still being visible to whoever reads it next: the phase the work belonged
# to, the ticket it came from, the agent that wrote it. All of it made sense in
# the run that emitted it and none of it means anything a week later.
#
# Source channel only, and outside a UI scan: `redpen code` runs these.

- id: orchestration-marker
  kind: slop
  title: A phase or task id left in the source
  category: residue
  severity: medium
  weight: 66
  evidenceRank: null
  sources:
    - { origin: redpen, ref: orchestration-residue }
  channels: [source]
  source:
    patterns:
      # The optional TODO( is not decoration. The id almost never sits bare
      # against the comment marker in real code: it arrives as `TODO(L2-04):`
      # or `FIXME(P3-11)`, and requiring the marker adjacent meant the most
      # common shape there is went straight past.
      - '(//|#|\*|<!--)\s*((TODO|FIXME|NOTE|HACK|XXX)\s*[([])?\s*\b(L[0-9]{1,2}|P[0-9]{1,2}|M[0-9]{1,2})\s*[-–—:]\s*\S'
      - '(//|#|\*)\s*\b(phase|milestone|casting|task|ticket|story|epic)\s+[#-]?\d+\b'
      - '(//|#|\*)[^\n]{0,40}\b(per|from|for)\s+(the\s+)?(phase|milestone|spec|plan|roadmap)\s+(above|below|doc|file|\d)'
      - '(//|#|\*)\s*(as (required|specified) by|required by)\s+(the\s+)?(phase|spec|plan|milestone)\b'
  why: >-
    "L1- we had to add this because the phase required it" is a note to the run
    that produced it. Whoever reads the file next has no phase, no plan, and no
    way to look up what L1 was, so the sentence explains the code with a fact
    they cannot check.
  fix: >-
    Say the reason without the reference. If the phase document held the real
    justification, move that sentence into the comment; if it did not, the
    comment was never explaining anything.

- id: agent-attribution
  kind: slop
  title: The tool that wrote it, named in the code
  category: residue
  severity: medium
  weight: 63
  evidenceRank: null
  sources:
    - { origin: redpen, ref: orchestration-residue }
  channels: [source]
  source:
    patterns:
      - '(//|#|\*|<!--)[^\n]{0,30}\b(Generated (by|with)|Written (by|with|using)|Authored by|Created (by|with))\s+(an?\s+)?(AI|LLM|Claude|GPT|Copilot|Cursor|Gemini|ChatGPT)\b'
      # A JSDoc byline and the disclosure sentence, both of which a caricature
      # fixture never produces and real code does: `@author Claude` and
      # "Written with AI assistance", beside the obvious "generated by Claude
      # Code".
      - '@author\s+(AI|LLM|Claude|GPT-?[0-9]?|Copilot|Cursor|Gemini|ChatGPT)\b'
      - '(//|#|\*)[^\n]{0,30}\b(AI[- ]assisted|with AI assistance|using AI)\b'
      - '(//|#|\*)[^\n]{0,20}\bAs an AI\b'
      - '(//|#|\*)\s*Co-Authored-By:\s*\S'
      - '(//|#|\*)[^\n]{0,30}\b(this (code|function|file) was (generated|produced|created) (by|using))\b'
  why: >-
    A byline in a comment tells the reader who typed it and nothing about what
    it does. It also outlives its accuracy the first time somebody edits the
    function underneath it, at which point the file is claiming an author it no
    longer has.
  fix: >-
    Delete it. Authorship lives in the history, where it stays correct as the
    code changes.

- id: conversation-artifact
  kind: slop
  title: Half of a conversation, committed
  category: residue
  severity: low
  weight: 55
  evidenceRank: null
  sources:
    - { origin: redpen, ref: orchestration-residue }
    - { origin: catalogue, ref: "code:CODE-01" }
  channels: [source]
  source:
    patterns:
      - '(//|#|\*)\s*(Certainly|Of course|Sure thing|Great question|Happy to help|Let me know if)\b'
      - '(//|#|\*)\s*(Here''?s|Here is) (the|a|an|your) (updated|revised|corrected|new|complete)\b'
      - '(//|#|\*)\s*(I''ve|I have) (added|updated|changed|refactored|implemented|created)\b'
      - '(//|#|\*)\s*(Note|Notice) that (I|we) (have |''ve )?(added|changed|updated|removed)\b'
  why: >-
    "Here's the updated function" and "I've added error handling" are replies,
    written to somebody who asked. Committed, they address a reader who was not
    in the conversation and cannot see the question.
  fix: >-
    Delete them. Nothing is lost: the sentence was answering a question the file
    does not contain.

- id: dead-scaffold-reference
  kind: quality
  title: A pointer to a file that is not there
  category: residue
  severity: medium
  weight: 58
  evidenceRank: null
  sources:
    - { origin: redpen, ref: orchestration-residue }
  channels: [source]
  source:
    caseSensitive: true
    patterns:
      - '(//|#|\*)\s*(See|see|Refer to|refer to)\s+[\w./-]+\.(md|txt|yaml|yml|json)\b[^\n]{0,30}\b(for (details|context|the plan|why))'
      # Case-sensitive: the tell is a SCREAMING_CASE plan document, and under
      # the default `i` flag [A-Z_]{3,} matched `readme.md` and `notes.md`,
      # every filename, which is every comment that mentions one.
      - '(//|#|\*)[^\n]{0,30}\b([Dd]escribed|[Dd]ocumented|[Ss]pecified|[Pp]lanned) in\s+[A-Z][A-Z_0-9]{2,}\.md\b'
      - '(//|#|\*)\s*(TODO|NOTE)[^\n]{0,20}\bsee\s+(the\s+)?(plan|spec|roadmap|handoff|brief)\b'
  why: >-
    A comment pointing at ROADMAP.md or a handoff note is only as good as the
    file, and those files are written for a run and deleted after it. The
    pointer stays, so the code appears to be explained somewhere and is not.
  fix: >-
    Bring the sentence into the comment, or drop the pointer. A reference that
    cannot be followed is worse than no reference, because it stops the reader
    looking for a real explanation.

- id: versioned-filename
  kind: slop
  title: A file named after its own revision
  category: residue
  severity: medium
  weight: 64
  evidenceRank: null
  sources:
    - { origin: redpen, ref: naming-residue }
  channels: [source]
  source:
    paths:
      - '(^|/)[\w.-]+[-_.](v[0-9]+|new|old|final|latest|updated|revised|copy|backup|orig|bak|fixed|temp|tmp)\.[a-z]+$'
      - '(^|/)[\w-]+[0-9]\.(ts|tsx|js|jsx|go|py|rb|rs|java|css)$'
      - '(^|/)(copy of|Copy of)[\w -]+\.'
  why: >-
    `handler-v2.ts` beside `handler.ts` asks every reader to work out which one
    runs, and the answer is in neither name. Version lives in the history, where
    it stays right; a suffix freezes one moment of a file's life into the thing
    everyone types for the rest of it.
  fix: >-
    Delete the old one (it is in the history) and let the good name go to the
    file that survived. Where both are live, name them for what makes them
    different rather than for which came second.
