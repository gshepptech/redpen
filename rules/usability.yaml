# Usability rules, merged from the frontend-design-audit heuristic set.
#
# These never appear in the Reddit complaint data — nobody on Reddit says "this
# site lacks an undo affordance". They are here because a page can pass every
# slop check and still be unusable, and because these are the findings that
# survive contact with an actual user. Weights are assigned by consequence, not
# by how often the tell is named.

- id: no-loading-state
  requires: [javascript]
  kind: quality
  title: Async action with no loading state
  category: usability
  severity: high
  weight: 69
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "heuristic:1-visibility-of-system-status" }
    - { origin: heuristics, ref: "pattern:button-loading-state" }
  channels: [source]
  source:
    patterns:
      # The inline handler is the tutorial shape. Real components extract it —
      # `onSubmit={submit}` with `async function submit()` above — and the rule
      # could not see that at all, which is most React ever written.
      - 'onClick=\{[^}]*await\s'
      - 'onSubmit=\{[^}]*(fetch|axios|api)\.'
      - 'async function \w+\([^)]*\)[^{]*\{[^}]*await [^}]*\}[\s\S]{0,600}?on(Submit|Click)=\{\w+\}'
    # A pending flag is set a line or two into the handler, not on the line the
    # await is on. Same-line suppression reported a button that carries
    # `disabled` eight lines below its own onClick.
    suppress: '(isLoading|isPending|loading|pending|isSubmitting|disabled|setBusy|setSaving|setCreating)'
    suppressLines: 12
    minHits: 1
  why: >-
    The user clicks, nothing changes, they click again. Duplicate submissions
    and abandoned flows both start here.
  fix: >-
    Disable the control and swap the label while the request is in flight.
    Restore on both success and failure.

- id: no-empty-state
  requires: [javascript]
  kind: quality
  title: List with no empty state
  category: usability
  severity: medium
  weight: 57
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:empty-states-with-guidance" }
    - { origin: heuristics, ref: "heuristic:10-help-and-documentation" }
  channels: [source, render]
  source:
    patterns:
      - '\.map\((\w+|\([^)]*\))\s*=>'
    suppress: '(length\s*===?\s*0|length\s*\?|isEmpty|\.length\s*>\s*0|EmptyState)'
    minHits: 3
  render:
    check: empty-container
  why: >-
    A blank panel where the list should be. The user cannot tell whether it is
    loading, broken, or genuinely empty.
  fix: >-
    Say what would be here, and give the action that puts something here.

- id: destructive-without-confirm
  requires: [javascript]
  kind: quality
  title: Destructive action with no confirmation or undo
  category: usability
  severity: critical
  weight: 81
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "heuristic:5-error-prevention" }
    - { origin: heuristics, ref: "pattern:confirmation-dialog" }
    - { origin: heuristics, ref: "pattern:undo-with-toast" }
  channels: [source]
  source:
    patterns:
      # `remove`, `clear` and `reset` are gone. They fired on every form builder
      # in reach — removeService in a deploy wizard, removeComponent on a chip
      # in a draft, a Remove button beside a row being composed. Nothing is
      # saved yet in any of them, and the rule is about work that is.
      #
      # delete, destroy and wipe are what a codebase says when the data is real,
      # and the labels below are what a button says when it means it.
      - 'onClick=\{[^}]*\b(delete|destroy|wipe|purge)[A-Z]\w*\('
      - '>\s*(Delete|Delete all|Clear all|Discard|Wipe)\s*<'
    suppress: '(confirm|Confirm|AlertDialog|undo|Undo|areYouSure)'
    minHits: 1
  why: >-
    Irreversible work destroyed by one misclick. This is the single highest-cost
    usability failure in the catalogue.
  fix: >-
    Undo-on-toast is better than a confirm dialog for anything recoverable.
    Reserve the modal for genuinely permanent actions and name the object in it.

- id: confirm-for-reversible
  requires: [javascript]
  kind: quality
  title: Confirmation dialog for a reversible action
  category: usability
  severity: low
  weight: 38
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "antipattern:confirmation-dialogs-for-reversible-actions" }
  channels: [source]
  source:
    patterns:
      - '(confirm\(|AlertDialog)[^)]{0,120}\b(archive|hide|unpublish|mark|move|rename)\b'
  why: >-
    Interrupting the user to confirm something they can undo in one click.
    It trains people to dismiss dialogs without reading them.
  fix: >-
    Do the thing, show an undo.

- id: no-inline-validation
  requires: [javascript]
  kind: quality
  title: Form validation only on submit
  category: usability
  severity: medium
  weight: 62
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "heuristic:9-error-recovery" }
    - { origin: heuristics, ref: "pattern:inline-validation" }
  channels: [source]
  source:
    # Three or more text inputs before the form closes. A single-field
    # newsletter box with `type="email" required` is fully covered by native
    # constraint validation and needs nothing added.
    patterns:
      - '<form\b(?:(?!</form>)[\s\S]){0,4000}?(?:<(?:input|textarea)\b(?:(?!</form>)[\s\S]){0,2000}?){3,}'
    suppress: '(onBlur|validate|useForm|zodResolver|aria-invalid|onChange=\{)'
    minHits: 1
  why: >-
    The user fills eight fields, submits, and gets one error at the top. Every
    round trip loses people.
  fix: >-
    Validate on blur, clear the error on input, and tie the message to the field
    with aria-describedby.

- id: generic-error-message
  kind: quality
  title: Error message that says nothing
  category: usability
  severity: medium
  weight: 59
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:specific-actionable-error-messages" }
    - { origin: heuristics, ref: "heuristic:9-error-recovery" }
  channels: [source]
  source:
    patterns:
      - '[''"`](Something went wrong|An error occurred|Invalid input|Error|Failed|Please try again)[.!]?[''"`]'
  why: >-
    The user learns that it broke, not what broke or what to do. These strings
    are the default because the real message requires knowing the failure mode.
  fix: >-
    Name what failed and the next action. "That email is already registered —
    sign in instead?"

- id: form-data-loss
  requires: [javascript]
  kind: quality
  title: Form clears on error
  category: usability
  severity: high
  weight: 71
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "heuristic:15-tolerance-and-forgiveness" }
    - { origin: heuristics, ref: "pattern:preserve-form-data-on-error" }
  channels: [source]
  source:
    patterns:
      - 'catch\s*\([^)]*\)\s*\{[^}]*\b(reset|setForm|clearForm)\('
      - '\.reset\(\)[^;]*;?\s*\}\s*catch'
  why: >-
    Twelve fields wiped by a network blip. Losing someone's typing is the
    fastest way to lose the person.
  fix: >-
    Preserve state on failure. Autosave anything that takes more than a minute
    to fill.

- id: no-unsaved-warning
  requires: [javascript]
  kind: quality
  title: No warning when leaving unsaved work
  category: usability
  severity: medium
  weight: 58
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:unsaved-changes-warning" }
  channels: [source]
  source:
    patterns:
      - '<textarea\b'
    suppress: '(beforeunload|isDirty|useBlocker|autosave|autoSave)'
    minHits: 1
  why: >-
    A long-form editor that loses everything on a stray back button.
  fix: >-
    beforeunload when dirty, or autosave to local storage on a debounce.

- id: hover-only-affordance
  kind: quality
  title: Action revealed only on hover
  category: usability
  severity: high
  weight: 68
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "antipattern:hover-only-affordances" }
    - { origin: catalogue, ref: content-hidden-at-rest }
    - { origin: heuristics, ref: "heuristic:11-affordances-and-signifiers" }
  channels: [source, render]
  source:
    patterns:
      - 'opacity-0\s+[^"''`]*group-hover:opacity-100'
      - 'invisible\s+[^"''`]*group-hover:visible'
  render:
    check: hover-revealed-control
  why: >-
    There is no hover on touch. Any control that only appears on hover does not
    exist for half the audience.
  fix: >-
    Show it always at reduced emphasis, or move it into a menu that has a
    persistent trigger.

- id: no-focus-visible
  kind: quality
  title: Interactive element missing focus, active, or disabled styling
  category: usability
  severity: critical
  weight: 79
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "slop-gate:26" }
    - { origin: heuristics, ref: "pattern:focus-visible-styles" }
    - { origin: heuristics, ref: "heuristic:13-accessibility" }
  channels: [source, render]
  source:
    patterns:
      - 'outline\s*:\s*(none|0)\b'
    suppress: 'focus-visible|:focus\s*\{[^}]*outline'
  render:
    check: interactive-state-coverage
    params:
      required: [hover, focus-visible, active, disabled]
  why: >-
    `outline: none` with nothing replacing it strands every keyboard user. It is
    the most common single line that breaks accessibility.
  fix: >-
    Default, hover, focus-visible, active, and disabled all styled. Focus rings
    need 3:1 against the adjacent surface.

- id: div-as-button
  requires: [javascript]
  kind: quality
  title: Clickable element that is not a button or link
  category: usability
  severity: high
  weight: 73
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:link-vs-button-semantics" }
    - { origin: heuristics, ref: "pattern:keyboard-accessible-custom-elements" }
  channels: [source, render]
  source:
    patterns:
      - '<(div|span)[^>]*onClick=(?![^>]*role=)'
  render:
    check: nonsemantic-interactive
  why: >-
    A div with a click handler is invisible to keyboard and screen reader users
    and gets no focus, no Enter key, and no role.
  fix: >-
    Use a button for actions and an anchor for navigation. If the element must
    stay a div, add role, tabindex, and a keydown handler.

- id: no-skip-link
  kind: quality
  title: No skip-to-content link
  category: usability
  severity: low
  weight: 44
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:skip-navigation-link" }
  channels: [source, render]
  source:
    patterns:
      - '<nav\b'
    suppress: '(skip-to|skip-link|Skip to (main|content))'
    minHits: 1
  render:
    check: skip-link-present
  why: >-
    Keyboard users tab through the entire navigation on every page load.
  fix: >-
    One visually-hidden anchor to #main that becomes visible on focus.

- id: no-active-nav-state
  kind: quality
  title: Navigation with no current-page indicator
  category: usability
  severity: medium
  weight: 55
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:active-navigation-state" }
    - { origin: heuristics, ref: "heuristic:1-visibility-of-system-status" }
  channels: [source, render]
  source:
    patterns:
      - '<nav\b'
    suppress: '(aria-current|isActive|activeClassName|data-active)'
    minHits: 1
  render:
    check: nav-current-marker
  why: >-
    Nothing in the navigation says where you are.
  fix: >-
    `aria-current="page"` on the active item, plus a visible treatment that is
    not colour alone.

- id: modal-no-escape
  requires: [javascript]
  kind: quality
  title: Modal with no escape route
  category: usability
  severity: high
  weight: 70
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:modal-escape-mechanisms" }
    - { origin: heuristics, ref: "heuristic:3-user-control-and-freedom" }
  channels: [source, render]
  source:
    patterns:
      - '(Modal|Dialog|Overlay)\b[^>]*>'
    suppress: '(onEscape|Escape|onOpenChange|onDismiss|closeOnOverlay|DialogClose)'
    minHits: 1
  render:
    check: dialog-dismissal
    params:
      required: [escape-key, overlay-click, close-button]
  why: >-
    A dialog you can only leave by completing it. Escape, the overlay, and a
    visible close control should all work.
  fix: >-
    Wire all three, trap focus inside while open, and return focus to the
    trigger on close.

- id: no-autosave-long-form
  requires: [javascript]
  kind: quality
  title: Long form with no autosave
  category: usability
  severity: low
  weight: 42
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "pattern:auto-save-for-long-forms" }
  channels: [source]
  source:
    patterns:
      - '<form\b[\s\S]{0,6000}?(<input[\s\S]{0,6000}?){7,}'
    suppress: '(autosave|autoSave|localStorage|useDebounce)'
  why: >-
    Seven or more fields with no recovery path if the tab closes.
  fix: >-
    Debounced write to local storage, restored on mount, cleared on submit.

- id: input-zoom-font-size
  kind: quality
  title: A text field below the size that stops iOS zooming
  category: usability
  severity: high
  weight: 74
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: mobile-input-zoom-floor }
    - { origin: heuristics, ref: "heuristic:14-perceptibility" }
  channels: [render]
  render:
    check: input-zoom-font-size
    params:
      minFontSizePx: 16
  why: >-
    iOS Safari zooms the entire page when a text field under 16px takes focus,
    and does not zoom back out when the field is blurred. The layout the author
    tested is not the layout the user ends up in, and nothing looks wrong until
    someone taps a field — which is why this survives review and ships.

    It is a separate rule from the general type floor on purpose: 14px is a
    perfectly good size for a label and a defect on an input, and one number
    cannot say both.
  fix: >-
    16px minimum computed font-size on every text-entry field. Scale the field
    down with padding and height if it needs to look smaller; the zoom triggers
    on font-size alone.

- id: adjacent-tap-targets
  kind: quality
  title: Controls with no gap between them
  category: usability
  severity: medium
  weight: 66
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: tap-target-separation }
    - { origin: heuristics, ref: "heuristic:13-touch-target-size" }
  channels: [render]
  render:
    check: adjacent-tap-targets
    params:
      minGapPx: 8
  why: >-
    Size is only half of a tap target. Two controls that each clear 44px but
    touch each other still produce mis-taps, because a finger contact patch is
    wider than the gap and the wrong one wins. A row of icon buttons packed
    edge to edge is the usual shape.
  fix: >-
    8px minimum between adjacent controls, measured between their boxes rather
    than their icons. Padding inside a control does not count — the gap has to
    be outside it.
  legitimateWhen: >-
    Segmented controls and button groups are deliberately contiguous, because
    they read as one control with several states rather than several controls.

- id: wrapped-control-label
  kind: quality
  title: A button label wrapping onto a second line
  category: usability
  severity: medium
  weight: 58
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: button-label-wrap }
  channels: [render]
  render:
    check: wrapped-control-label
    params:
      desktopOnlyAbovePx: 1000
  why: >-
    The control was sized for a shorter string than the one it holds. It reads
    as an accident rather than a decision, and it is the first thing a longer
    translation breaks — German runs about a third longer than English, so a
    label that just fits in English does not.
  fix: >-
    Shorten the label or let the control size to its content. A fixed width on
    a control that holds translatable text is the underlying mistake.
