# Copy tells.
#
# Copy ranks low individually (11th band) but it is the cheapest category to
# fix and the one non-designers notice first. Source channel only: the words
# are the same in the file and on the screen.

- id: marketing-buzzword
  kind: slop
  surfaces: [persuade, read]
  title: Generated marketing cliche
  category: copy
  severity: medium
  weight: 51
  evidenceRank: 11
  sources:
    - { origin: study, ref: hype-copy }
    - { origin: catalogue, ref: marketing-buzzword }
    - { origin: catalogue, ref: theater-slop-phrase }
  channels: [source, vision]
  source:
    # `{/* … */}` is the only way to write a comment inside JSX, so the
    # suppression matches the braced form as well as `//`, `/*` and `<!--`.
    #
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(supercharge|unleash|revolutionize|revolutionise|seamlessly|effortlessly|game-changer|cutting-edge|next-level|10x your|unlock the power|take .{1,20} to the next level)\b'
      - '\bthe future of \w+ is here\b'
      - '\b(blazing|lightning)[- ]fast\b'
      - '\bbuilt for (the way )?(modern|today''s) \w+\b'
  vision:
    ask: >-
      Is the headline a generic superlative that would fit any product in any
      category, rather than a specific checkable claim?
  why: >-
    Superlatives that survive a find-and-replace of the product name are not
    saying anything about the product.
  fix: >-
    Replace with the specific claim. What does it do, for whom, and what is the
    number.

- id: vague-headline
  kind: slop
  surfaces: [persuade]
  title: Headline that names no subject
  category: copy
  severity: medium
  weight: 54
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: marketing-buzzword }
    - { origin: catalogue, ref: "critique-axis:D-specificity" }
  channels: [vision]
  vision:
    ask: >-
      Could this hero headline be moved onto a completely different company's
      site without editing it?
  why: >-
    "Build better, faster" describes nothing. The reader leaves without learning
    what the product is.
  fix: >-
    Name the thing and the outcome in the headline. Save the mood for the
    subheading.

- id: em-dash-overuse
  kind: slop
  advisory: true
  title: Em dashes throughout the copy
  category: copy
  severity: low
  weight: 46
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: em-dash-overuse }
    - { origin: study, ref: copy-tells }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    # A list item that opens with a bolded lead term or a link and separates it
    # with a dash is typography, not a prose splice: `- **Term** — description`
    # is a definition list wearing markdown. The catalogue this rule comes from
    # carves those out by name, and redpen was counting them.
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)|^\s*[-*+]\s+(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]*\))\s*—'
    patterns:
      - '—'
      # The double-hyphen substitute is the same tell typed by someone whose
      # editor does not make the character, and it is never carved out.
      - '(?<=\w)\s--\s(?=\w)'
    minHits: 6
  why: >-
    The single most-named tell in AI *prose*, and it carries onto interface
    copy. Six or more on one page is a pattern, not a style.
  fix: >-
    Most become commas or full stops. Keep one where the interruption is doing
    real work.

- id: aphoristic-cadence
  kind: slop
  advisory: true
  title: The "not just X, but Y" cadence
  category: copy
  severity: low
  weight: 45
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: aphoristic-cadence }
    - { origin: study, ref: copy-tells }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\bnot just \w+[^.]{0,40}\bbut\b'
      - '\bit''?s not (about|just) [^.]{0,40}\bit''?s\b'
      - '\bmore than (just )?(a|an) \w+'
    minHits: 2
  why: >-
    The rhetorical shape models fall into when a sentence needs to sound
    important. Once you see it you cannot unsee it.
  fix: >-
    State the second half as a plain sentence and delete the first.

- id: generic-cta
  kind: slop
  surfaces: [persuade]
  title: Generic call to action
  category: copy
  severity: medium
  weight: 49
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: marketing-buzzword }
    - { origin: heuristics, ref: "heuristic:2-match-real-world" }
  channels: [source, render]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '>\s*(Get Started|Learn More|Sign Up Free|Try It Now|Get Started Free|Start Free Trial)\s*<'
    minHits: 3
  render:
    check: duplicate-cta-label
    params:
      minRepeats: 3
  why: >-
    "Get Started" three times on one page, each going somewhere different. The
    label should say what happens next.
  fix: >-
    Name the destination. "Read the docs", "Create a project", "Book a call".

- id: placeholder-name
  kind: slop
  title: Placeholder names and startup cliches
  category: copy
  severity: medium
  weight: 50
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "slop-gate:19" }
    - { origin: catalogue, ref: "antipattern:placeholder-names" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(Jane|John) (Doe|Smith)\b'
      - '\b(Acme|Acme Corp|Lorem ipsum|Example Corp|Widget Co)\b'
      - '\b(Nexus|Zenith|Apex|Vertex|Quantum|Synergy|Catalyst)\s+(AI|Labs|Systems|Solutions|Dynamics)\b'
  why: >-
    Testimonials from Jane Doe at Acme. Fake social proof is worse than none,
    and it is the clearest sign the page was never reviewed.
  fix: >-
    Real names and real quotes, or cut the section.

- id: invented-metrics
  kind: slop
  surfaces: [persuade]
  title: Statistics with no source
  category: copy
  severity: high
  weight: 67
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "antipattern:invented-metrics" }
    - { origin: catalogue, ref: "slop-gate:honest-copy" }
  channels: [source, vision]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      # Listing the numbers and nouns to accept would miss "Trusted by 50,000+
      # land managers". A claim's shape is the tell, not its vocabulary.
      - '\b\d{1,3}(\.\d)?x\s+(faster|more|fewer|better|cheaper|higher|lower)\b'
      - '\b(9[0-9](\.\d{1,2})?)%\s+(uptime|availability|accuracy|accurate)\b'
      # A bare percentage is not a claim to a reader. `60% more` is just as
      # likely a sourced fact in code, on a page nobody markets. What makes an
      # invented metric one is
      # the framing around the number, so only framed shapes are matched.
      - '(?:trusted by|join|over|more than|used by|powering)\s+\d{1,3}(,\d{3})+\+?\s+\w+'
      - '\b\d{1,3}(,\d{3})+\+\s+\w+'
  vision:
    ask: >-
      Does the page state numbers (user counts, percentage gains, uptime)
      without attributing them to anything?
  why: >-
    "10,000+ developers" on a site with no users. Fabricated numbers are a
    liability, not just a tell.
  fix: >-
    Use real numbers or remove the claim. If the number is real, say where it
    comes from and when it was measured.

- id: straight-quotes
  kind: slop
  advisory: true
  title: Straight quotes and hyphen dashes
  category: copy
  severity: low
  weight: 32
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "antipattern:straight-quotes" }
    - { origin: catalogue, ref: "antipattern:double-hyphen-dashes" }
    - { origin: catalogue, ref: "antipattern:three-periods-instead-of-ellipsis" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '>[^<]*\b\w+''\w+[^<]*<'
      - '\w\s--\s\w'
      - '\w\.\.\.(?!\.)'
    minHits: 3
  why: >-
    Typographic detail is where care shows. Straight apostrophes in rendered
    prose say nobody read the page as a reader.
  fix: >-
    Curly quotes and apostrophes, a real en or em dash, a real ellipsis
    character.

- id: tricolon-cadence
  kind: slop
  surfaces: [persuade, read]
  title: Everything arrives in threes
  category: copy
  severity: low
  weight: 46
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:tricolon" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(fast|simple|reliable|secure|powerful|flexible|modern|clean|smart|scalable), (fast|simple|reliable|secure|powerful|flexible|modern|clean|smart|scalable),? and (fast|simple|reliable|secure|powerful|flexible|modern|clean|smart|scalable)\b'
      - '\b(plan|design|build|ship|develop|deploy|create|launch|track|measure), (plan|design|build|ship|develop|deploy|create|launch|track|measure),? and (plan|design|build|ship|develop|deploy|create|launch|track|measure)\b'
  why: >-
    Three items are rhythmically satisfying and cost nothing to produce, so they
    turn up everywhere. One tricolon on a page is a device; the fourth is a tic,
    and by then the reader is hearing the rhythm instead of the claim.
  fix: >-
    Use one item where one is true. Vary the count. If three things genuinely
    belong together, keep the set and break the parallel grammar.

- id: hedged-claim
  kind: slop
  surfaces: [persuade, read]
  title: A claim with the claim hedged out of it
  category: copy
  severity: medium
  weight: 52
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:hedging" }
    - { origin: catalogue, ref: "writing:hedge-stacked-predictions" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\bis designed to (help|improve|reduce|increase|make|ensure|enable)\b'
      - '\b(may|might|could) (potentially|eventually|ultimately|significantly) \w+'
      - '\b(aims to|seeks to|strives to|helps you to)\b'
      - '\bcan (help|potentially) (you )?(reduce|improve|increase|save|boost)\b'
  why: >-
    "Designed to improve accuracy" tells the reader you are not sure it does.
    Stacking a modal on a hedge adverb ("could potentially", "may eventually")
    is the same move twice: each word cancels the next, and the sentence asserts
    nothing while sounding careful.
  fix: >-
    Claim it or drop it. If you are not certain, say what you did measure and
    under what conditions.

- id: false-breadth
  kind: slop
  surfaces: [persuade]
  title: An audience defined so widely it names nobody
  category: copy
  severity: medium
  weight: 50
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:problem-paragraph" }
    - { origin: catalogue, ref: "writing:template-phrases" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      # An audience, not any either/or. "whether it's in testing or live" is a
      # real distinction in help text about NODE_ENV, not a page refusing to
      # name who it is for.
      - '\bwhether (you''re|you are|your team is) (an?|the)? ?\w+ (\w+ )?or\b'
      - '\bfrom (startups|solo founders|individuals|small teams) to (enterprises|large organi[sz]ations|global teams)\b'
      - '\bfor (teams|businesses|creators|developers) of (all|any) (sizes?|kinds?)\b'
  why: >-
    "Whether you are a solo founder or part of a growing team" is a shape that
    means everyone, which means nobody recognises themselves in it. Naming two
    ends of a spectrum is how a page avoids choosing an audience.
  fix: >-
    Name the one audience the page is for. The people outside it will work out
    that it is not for them, and the people inside it will know it is.

- id: transition-filler
  kind: slop
  surfaces: [persuade, read]
  title: Connectives doing no connecting
  category: copy
  severity: low
  weight: 42
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "writing:transition-phrases" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '(^|>|\s)(moreover|furthermore|additionally|in conclusion|in summary|to summari[sz]e)\b'
      - '\b(it''s|it is) worth noting that\b'
      - '\bin (today''s|an era where|a world where)\b'
      - '\bhere''s what (caught my eye|stood out|makes it interesting)\b'
  why: >-
    "Moreover" and "Furthermore" mark a connection the sentences do not have;
    "In today's fast-moving landscape" sets a scene nobody needed. They are the
    joins of an outline that was filled in rather than written.
  fix: >-
    Cut them and see whether the paragraph still reads. It almost always does,
    and where it does not, the fix is the order of the sentences.

- id: significance-inflation
  kind: slop
  surfaces: [persuade, read]
  title: A routine thing described as history
  category: copy
  severity: low
  weight: 45
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "writing:significance-inflation" }
    - { origin: catalogue, ref: "writing:future-narrative-closers" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(pivotal|watershed|defining|landmark|seminal) (moment|shift|change)\b'
      - '\bmark(s|ing)? a new (era|chapter|age)\b'
      - '\b(may|could|will|is poised to) become one of the most \w+ (narratives?|trends?|stories|chapters?|themes?)\b'
      - '\bthe (evolution|future) of \w+ (is|has) (here|arrived|begun)\b'
  why: >-
    "Marking a pivotal moment in the evolution of" inflates a release into an
    epoch. The closing prediction is the same move: grammatically a forecast,
    with nothing in it anyone could later check.
  fix: >-
    Say what happened and let the reader decide what it means. If the sentence
    still works with the inflation deleted, delete it.

- id: copula-avoidance
  kind: slop
  surfaces: [persuade, read]
  title: Press-release verbs standing in for "is"
  category: copy
  severity: low
  weight: 41
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "writing:copula-avoidance" }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page: a CSS comment explaining a design decision is not copy.
    # Copy lives in markup and in strings, not in a stylesheet, and a CSS block
    # comment's continuation lines carry no comment marker to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(serves as|stands as|represents a|boasts (a|an|over|more than)|is poised to)\b'
      - '\b(leverages?|utili[sz]es?) (the power of|cutting-edge|advanced)\b'
      - '\bdelivers (unparalleled|unmatched|best-in-class)\b'
  why: >-
    "Serves as", "boasts", "represents": fancier verbs standing in for "is" and
    "has". Individually harmless; together they are the register of a press
    release rather than a person explaining something.
  fix: >-
    Use "is" and "has" unless a more specific verb earns its place by adding
    meaning.

- id: bare-noun-bullets
  kind: slop
  surfaces: [persuade, read]
  title: A list where no item says anything
  category: copy
  severity: medium
  weight: 48
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "writing:bare-noun-bullets" }
    - { origin: catalogue, ref: "copy:feature-list-nobody-counted" }
  channels: [render]
  render:
    check: bare-noun-bullets
    params:
      minItems: 5
  why: >-
    Five or more list items in a row, each an adjective plus a noun, none of
    them asserting anything a reader could check. The tell is the symmetry: a
    real list has items of different lengths and at least one that does not fit
    the pattern.
  fix: >-
    Rewrite each item as a claim ("failed shares stayed under 1% across a
    twelve-hour run" beats "low failed share rates"), or turn the list into a
    paragraph. Where a bare list is genuinely right, vary the items.

# ---------------------------------------------------------------------------
# Added from copy-slop COPY-03, 05, 10 and 12. COPY-01, 02, 04, 08 and 09 are
# already covered by invented-metrics, false-breadth, placeholder-name,
# tricolon-cadence and emoji-as-icon respectively.
# ---------------------------------------------------------------------------

- id: benefit-without-mechanism
  kind: slop
  surfaces: [persuade]
  title: A benefit with no mechanism behind it
  category: copy
  severity: medium
  weight: 58
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:COPY-03" }
    - { origin: catalogue, ref: "antipattern:benefit-without-mechanism" }
  channels: [source]
  source:
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    # The comparison can be made before the adjective as well as after it, and
    # a lookahead sees only one direction: "it will make your life worse rather
    # than better" is a page naming who it is *not* for. A `than` anywhere on
    # the line means a comparison is being drawn.
    suppress: '^\s*(//|\*|/\*|#|<!--)|\bthan\b|\d'
    patterns:
      # A comparative with nothing on the other side of it. "Faster" is a claim
      # about a measurement nobody made; "faster than the nightly export" is a
      # claim someone can check.
      - '\b(faster|smarter|simpler|easier|better|cheaper|safer|cleaner)\b(?![^.!?<]{0,40}\b(than|by|from|because|so that|using|with our|per|in \d))'
      - '\b(save|saves|saving) (you )?(time|money|hours|effort)\b(?![^.!?<]{0,30}\bby\b)'
  why: >-
    "Faster, smarter, simpler" is three claims with nothing to check any of
    them against. A reader who wants the product already believes it; a reader
    deciding cannot use it, so the sentence only reaches the people it did not
    need to reach.
  fix: >-
    Say the mechanism or the measurement. Faster than what, by how much, and
    because of what. One of those turns an adjective into a reason.

- id: no-exclusions
  kind: slop
  surfaces: [persuade]
  title: A pitch that never says who it is not for
  category: copy
  severity: low
  weight: 46
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:COPY-05" }
    - { origin: heuristics, ref: "specificity" }
  channels: [source]
  source:
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      # Universality asserted outright. A page that claims everyone is a page
      # that has not chosen anyone.
      - '\bfor (everyone|every team|any team|anyone|every business|all teams|any workflow|every workflow)\b'
      - '\b(whatever|whichever) (your|the) (size|team|stack|workflow|industry)\b'
      - '\bno matter (your|the|what) \w+'
      - '\bworks with (everything|anything|any \w+ you)\b'
  why: >-
    A page that never says who it is not for is a page that has not decided. The
    exclusion is the most useful sentence on a landing page, because it is the
    only one a reader can use to rule themselves in.
  fix: >-
    Name the case you do not serve. "Not for teams under five" or "no on-prem"
    costs you the readers who would have churned and earns the trust of the ones
    who stay.

- id: closing-paragraph-adds-nothing
  kind: slop
  surfaces: [persuade, read]
  title: A closing paragraph that restates the page
  category: copy
  severity: low
  weight: 44
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:COPY-10" }
    - { origin: catalogue, ref: "writing:summary-restatement" }
  channels: [source]
  source:
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)'
    patterns:
      - '\b(In (conclusion|summary|short)|To (summari[sz]e|sum up|recap)|All in all|At the end of the day|Ultimately,)\b'
      # The apostrophe is written as a character class rather than escaped: a
      # single-quoted YAML scalar ends at the first lone quote, and `\'` is not
      # an escape there.
      - '\bWhether you([^ a-z]re| are)[^.!?<]{0,60}\b(we|our|it)\b[^.!?<]{0,40}\b(got you|here to help|covered)\b'
  why: >-
    A paragraph that summarises what the reader just read is a paragraph
    written because the shape expected one. It is the last thing on the page and
    it says nothing, which is the worst place to say nothing.
  fix: >-
    End on the action, or end on the strongest specific claim. If the page needs
    summarising, the page is too long.

- id: undated-reference
  kind: quality
  # No `surfaces`: a quality rule holds everywhere, and the path match already
  # confines this one to the four files it is about.
  title: Documentation with no version or date on it
  category: copy
  severity: medium
  weight: 54
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "copy:COPY-12" }
    - { origin: heuristics, ref: "documentation-currency" }
  channels: [source]
  source:
    paths:
      - '(^|/)(CHANGELOG|RELEASES|UPGRADING|MIGRATION)\.mdx?$'
    patterns:
      # A changelog entry with a version and no date, or a heading that names
      # neither. The reader's first question about any of these files is "how
      # old is this", and it is the one question the file refuses to answer.
      - '(^|\n)#{1,3}\s*v?\d+\.\d+[^\n]{0,20}(\n|$)(?![^\n]*\d{4})'
      - '(^|\n)#{1,3}\s*(Unreleased|Latest|Recent [Cc]hanges)\s*(\n|$)'
  why: >-
    A changelog entry with no date is a claim the reader cannot place. Version
    numbers only order things relative to each other; a date is what tells
    someone whether this page has been touched since the thing they are using
    shipped.
  fix: >-
    Put an ISO date beside every version heading. It costs eight characters and
    it is the first thing anyone opening the file is looking for.

- id: couplet-cadence
  kind: slop
  surfaces: [persuade]
  title: Setup and payoff, over and over
  category: copy
  severity: low
  weight: 47
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: aphoristic-cadence }
    - { origin: catalogue, ref: "writing:aphorism-formulas" }
    - { origin: redpen, ref: couplet-density }
  channels: [source]
  source:
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    caseSensitive: true
    # Functional microcopy is not a cadence.
    #
    # "No expeditions found. Create your first one." and "Export failed. Please
    # try again." are the correct shape for an empty state and a status message
    # (a statement of what happened and the next action), and one app produced
    # twelve of them. What separates them from display copy is that the first
    # half reports a state rather than making a claim.
    suppress: '^\s*(\{\s*/\*|//|\*|/\*|#|<!--)|\bNo [a-z]+ (found|available|yet|attached|configured|selected)|\b(failed|succeeded|imported|exported|saved|deleted|updated|created|copied|removed|cancelled|canceled)\.|\b(Nothing|Please)\b|\.{3}'
    # Density is the whole finding. One "Push a button. Get the site." is a good
    # line; the tell is that every slide closes on one, so a single couplet must
    # never fire. Four in a document is a house cadence nobody chose.
    minHits: 4
    patterns:
      # Two short sentences, back to back, each three to five words. The second
      # is the payoff, and the shape is what survives when a model needs a line
      # to sound decisive.
      - '(?<=^|>|\s)[A-Z][a-z]+(?: [a-z]+){1,3}\.\s+[A-Z][a-z]+(?: [a-z]+){1,3}\.'
      # The negative form of the same beat: "No scripts. No playbooks."
      - '\bNo [a-z]+\.\s+No [a-z]+\.'
  legitimateWhen: >-
    A slide, a headline, or anything read in a glance. Short couplets are how
    display copy works, and one is a good line. The finding is only ever the
    density (every slide closing on the same beat), so a deck that uses two
    deliberately is not what this is about.
  why: >-
    "Push a button. Get the site." is a good sentence. Six of them across eight
    slides is a rhythm rather than a set of sentences, and the reader stops
    hearing the claims and starts hearing the metre. It is the cadence a model
    reaches for when a line has to sound decisive, and it does not vary because
    nothing in the writing is varying it.
  fix: >-
    Keep the best one or two and write the rest as ordinary sentences. A
    cadence only lands when it is not the only cadence in the document.

- id: em-dash-in-prose
  kind: slop
  advisory: true
  title: Em dashes throughout a document
  category: prose
  severity: low
  weight: 44
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: "writing:em-dashes" }
    - { origin: study, ref: copy-tells }
  channels: [source]
  source:
    # The page-side rule reads markup and never saw a .md, which is where this
    # tell was named in the first place: it is a *prose* pattern that carries
    # onto interface copy, and redpen only checked the copy.
    extensions: ['.md', '.markdown', '.rst', '.txt', '.adoc']
    # The catalogue puts the hard maximum at one per thousand words. Eight is
    # the threshold at which a document of any ordinary length has crossed it,
    # chosen so a long, carefully punctuated essay is not reported for being long.
    minHits: 8
    suppress: '^\s*[-*+]\s+(\*\*[^*]+\*\*|\[[^\]]+\]\([^)]*\))\s*—|^\s{4,}|^\s*(```|\|)'
    patterns:
      - '—'
      - '(?<=\w)\s--\s(?=\w)'
  legitimateWhen: >-
    A writer who genuinely punctuates this way, and there are many. This is the
    most-named tell in the sample and also the one humans use most legitimately,
    which is why it is advisory and never costs a score.
  why: >-
    The most-named tell in the study, and the one that carries furthest into
    documents. A dash earns its place by marking an interruption the sentence
    could not survive without; eight in one document means the shape is being
    used as a rhythm rather than for the interruption.
  fix: >-
    Most become commas or full stops. Keep the ones where the aside genuinely
    breaks the sentence, and rewrite the rest as two sentences.
