# Copy tells.
#
# Copy ranks low individually (11th band) but it is the cheapest category to
# fix and the one non-designers notice first. Source channel only — the words
# are the same in the file and on the screen.

- id: marketing-buzzword
  kind: slop
  surfaces: [persuade, read]
  title: Generated marketing cliche
  category: copy
  severity: medium
  weight: 51
  evidenceRank: 11
  sources:
    - { origin: study, ref: hype-copy }
    - { origin: catalogue, ref: marketing-buzzword }
    - { origin: catalogue, ref: theater-slop-phrase }
  channels: [source, vision]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page. These fired on a CSS comment explaining a design decision, a
    # code comment about "today's conditions" in a weather panel, and a help
    # string listing three platforms.
    # Copy lives in markup and in strings, not in a stylesheet. This fired on a
    # CSS block comment explaining why a list is keyboard-reachable, on the
    # continuation line, where no comment marker starts the line to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(//|\*|/\*|#|<!--)'
    patterns:
      - '\b(supercharge|unleash|revolutionize|revolutionise|seamlessly|effortlessly|game-changer|cutting-edge|next-level|10x your|unlock the power|take .{1,20} to the next level)\b'
      - '\bthe future of \w+ is here\b'
      - '\b(blazing|lightning)[- ]fast\b'
      - '\bbuilt for (the way )?(modern|today''s) \w+\b'
  vision:
    ask: >-
      Is the headline a generic superlative that would fit any product in any
      category, rather than a specific checkable claim?
  why: >-
    Superlatives that survive a find-and-replace of the product name are not
    saying anything about the product.
  fix: >-
    Replace with the specific claim. What does it do, for whom, and what is the
    number.

- id: vague-headline
  kind: slop
  surfaces: [persuade]
  title: Headline that names no subject
  category: copy
  severity: medium
  weight: 54
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: marketing-buzzword }
    - { origin: catalogue, ref: "critique-axis:D-specificity" }
  channels: [vision]
  vision:
    ask: >-
      Could this hero headline be moved onto a completely different company's
      site without editing it?
  why: >-
    "Build better, faster" describes nothing. The reader leaves without learning
    what the product is.
  fix: >-
    Name the thing and the outcome in the headline. Save the mood for the
    subheading.

- id: em-dash-overuse
  kind: slop
  advisory: true
  title: Em dashes throughout the copy
  category: copy
  severity: low
  weight: 46
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: em-dash-overuse }
    - { origin: study, ref: copy-tells }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page. These fired on a CSS comment explaining a design decision, a
    # code comment about "today's conditions" in a weather panel, and a help
    # string listing three platforms.
    # Copy lives in markup and in strings, not in a stylesheet. This fired on a
    # CSS block comment explaining why a list is keyboard-reachable, on the
    # continuation line, where no comment marker starts the line to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(//|\*|/\*|#|<!--)'
    patterns:
      - '—'
    minHits: 6
  why: >-
    The single most-named tell in AI *prose*, and it carries onto interface
    copy. Six or more on one page is a pattern, not a style.
  fix: >-
    Most become commas or full stops. Keep one where the interruption is doing
    real work.

- id: aphoristic-cadence
  kind: slop
  advisory: true
  title: The "not just X, but Y" cadence
  category: copy
  severity: low
  weight: 45
  evidenceRank: 11
  sources:
    - { origin: catalogue, ref: aphoristic-cadence }
    - { origin: study, ref: copy-tells }
  channels: [source]
  source:
    # A comment is addressed to whoever opens the file, not to a reader of
    # the page. These fired on a CSS comment explaining a design decision, a
    # code comment about "today's conditions" in a weather panel, and a help
    # string listing three platforms.
    # Copy lives in markup and in strings, not in a stylesheet. This fired on a
    # CSS block comment explaining why a list is keyboard-reachable, on the
    # continuation line, where no comment marker starts the line to suppress on.
    extensions: ['.html', '.htm', '.tsx', '.jsx', '.ts', '.js', '.mjs', '.vue', '.svelte', '.astro', '.mdx']
    suppress: '^\s*(//|\*|/\*|#|<!--)'
    patterns:
      - '\bnot just \w+[^.]{0,40}\bbut\b'
      - '\bit''?s not (about|just) [^.]{0,40}\bit''?s\b'
      - '\bmore than (just )?(a|an) \w+'
    minHits: 2
  why: >-
    The rhetorical shape models fall into when a sentence needs to sound
    important. Once you see it you cannot unsee it.
  fix: >-
    State the second half as a plain sentence and delete the first.

