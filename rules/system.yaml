# Design-system drift.
#
# Upstream checks literal values against a declared DESIGN.md: four rules that
# ask "is this value part of the system, or did somebody improvise it?". A count
# of distinct colours is a poor proxy for that: it flags a rich palette and
# misses a project that declared six tokens and then hard-coded twelve hexes.
#
# These read the declaration the project already has: the custom properties on
# :root. A project that defines --color-* and then writes #7c3aed in a component
# has drifted from its own system, and no external file is needed to prove it.
#
# Every rule here is silent on a project with no declared tokens: there is
# nothing to drift from, and "you have no design system" is a different finding
# that these rules would state badly.

- id: color-token-drift
  kind: quality
  title: Literal colours outside the project's own tokens
  category: system
  severity: medium
  weight: 63
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: design-system-color }
  channels: [render]
  render:
    check: color-token-drift
    params:
      minTokens: 4
      minDrift: 3
  why: >-
    The tokens exist and later components stopped using them. This is how a
    generated page ends up with nineteen near-identical greys, each one written
    where it was needed rather than referenced.
  fix: >-
    Replace each literal with the token it is approximating. If a value is
    genuinely new, add it to the token block first. The point is that the
    addition is a decision rather than a side effect.

- id: radius-token-drift
  kind: quality
  title: Radius values outside the project's own scale
  category: system
  severity: low
  weight: 48
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: design-system-radius }
  channels: [render]
  render:
    check: radius-token-drift
    params:
      minTokens: 2
      minDrift: 3
  why: >-
    A radius scale is information: small for controls, medium for cards, full
    for avatars. Improvised values erase the distinction the scale was carrying.
  fix: >-
    Snap each value to a declared step. If none fits, the scale is missing a
    step; add it deliberately.

- id: font-size-token-drift
  kind: quality
  title: Font sizes off the declared type ramp
  category: system
  severity: medium
  weight: 57
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: design-system-font-size }
  channels: [render]
  render:
    check: font-size-token-drift
    params:
      minTokens: 3
      minDrift: 4
  why: >-
    A ramp with four declared steps and nine sizes in use is not a ramp. The
    off-ramp values are where a component was sized to fit its box rather than
    to its role.
  fix: >-
    Move each value onto a declared step. A size that genuinely needs to exist
    is a new step in the ramp, not an exception to it.

- id: font-family-drift
  kind: quality
  title: Typefaces outside the declared type system
  category: system
  severity: medium
  weight: 60
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: design-system-font }
  channels: [render]
  render:
    check: font-family-drift
    params:
      minDrift: 1
  why: >-
    A face reaching the page without passing through the type tokens. Usually a
    component library shipping its own stack, or a fallback quietly winning
    because the intended face never loaded.
  fix: >-
    Route every family through a token. If the face is intentional, declare it;
    if it is a fallback that won, fix the loading rather than the symptom.

- id: cancelled-size-floor
  kind: quality
  title: A component rule cancels the size floor the base rule promised
  category: system
  severity: high
  weight: 81
  evidenceRank: null
  sources:
    - { origin: redpen, ref: cascade-cancelled-floor }
    - { origin: heuristics, ref: "heuristic:13-touch-target-size" }
  channels: [source]
  cascade:
    check: cancelled-size-floor
    params:
      floorPx: 44
  why: >-
    The base rule promises `min-height: 44px` and a more specific rule pins
    `height` below it. `height` beats `min-height` when it wins the cascade,
    so the floor is silently void wherever the component rule applies, and
    because the two declarations usually sit hundreds of lines apart, the
    person reading either one sees nothing wrong.

    The render channel can only report the symptom: this control computes to
    32px. That names a button, not a cause, so the same defect gets fixed once
    per component. A project reported fixing this three times before the
    pattern was visible. This rule reports the pair instead, with both
    selectors and both specificities, because the pair is what you change.
  fix: >-
    Decide which rule owns the size. Either drop the `height` and let the
    floor stand, or if the component genuinely needs to be smaller, say so
    where the floor is defined rather than overriding it from a distance:
    a `:where()` wrapper on the base rule drops its specificity to zero and
    makes the component rule's win explicit rather than accidental.
  legitimateWhen: >-
    A control that is never a touch target (a dense data-grid affordance
    shown only on hover, for instance) can legitimately sit below the floor.
    Say so at the base rule, so the exception is visible where the promise is.
