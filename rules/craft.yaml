# Code that reads as machine-written.
#
# Source channel only, and outside a UI scan on purpose: a page's markup and a
# project's source are different questions, and folding them together would
# change every score anyone holds a baseline for. `redpen code` runs these.
#
# Every rule here is about the shape of the writing, never about whether the
# code works. A comment that narrates an edit is not a bug; it is a sentence
# addressed to whoever was reviewing that afternoon, left in a file that will
# outlive them.

# Measured and rejected: comment length.
#
# Two shapes were tested against six real codebases and one fixture written to
# look like generated code.
#
#   density          7.6% to 35.7% of lines, and the generated fixture was the
#                    highest of the lot at 35.7% — just ahead of the most
#                    carefully maintained project at 30.2%. No threshold
#                    separates them.
#
#   disproportion    a comment block more than twice the length of the code it
#                    precedes: 12% to 42% of blocks, highest in the hand-written
#                    projects (42.5%, 40.6%, 38.0%) and 0% in the generated one.
#
# The signal runs backwards. Long comments on short code are what careful
# authorship looks like — the longest single block found was 232 lines above two
# lines of data, explaining why a product appears twice in a seed catalogue. A
# rule on either measure would fire hardest on the best-commented codebases and
# never on the generated one, which is the definition of a rule that costs more
# than it finds.
#
# What is a tell is a comment that says nothing the code does not already say,
# and that is what signature-restating-docstring measures. Length is not a
# proxy for it.

- id: edit-narrating-comment
  kind: slop
  title: A comment addressed to the reviewer, not the reader
  category: craft
  severity: medium
  weight: 68
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-01" }
  channels: [source]
  source:
    patterns:
      # Past tense about the author's own edit. Gerunds are out: "Adding a fifth
      # advisory means adding a row here" is an instruction to whoever comes
      # next, not a note about what happened. "Fixed" is out too — it is more
      # often "fixed order" or "fixed width" than "I fixed it", and it cost this
      # rule a false positive on `// Fixed, not the marks' insertion order`.
      - '(//|#|\*)\s*(Added|Updated|Changed|Removed|Refactored|Renamed|Moved|Replaced)\b[^\n]{0,60}\b(here|above|below|this|to (use|be|match|support)|from|for (now|clarity|consistency))\b'
      - '(//|#|\*)\s*(NEW|OLD|WAS|BEFORE|AFTER)\s*[::-]'
      - '(//|#|\*)\s*(As (requested|discussed|per)|Per (the|your) (request|feedback|review))\b'
      - '(//|#|\*)\s*(This (was|has been) (added|updated|changed|refactored))\b'
    # A clause giving the reason makes it an explanation rather than a diary
    # entry. `// Added here (before Terra Draw) so it sits beneath the outlines`
    # narrates an edit and also says why the order matters, and the why is the
    # part worth keeping.
    # Two suppressions, both learned from real comments.
    #
    # A clause giving the reason makes it an explanation rather than a diary
    # entry: `// Added here (before Terra Draw) so it sits beneath the outlines`
    # narrates an edit and also says why the order matters, and the why is the
    # part worth keeping.
    #
    # And a line starting lower-case is the middle of a sentence, not the start
    # of a note. Patterns compile case-insensitively, so "the vendor renamed
    # this product" and "a field added to a type in lib/types.ts" would match
    # on their continuation lines for containing a verb.
    caseSensitive: true
    suppress: '\b(because|so that|so it|so the|which is|otherwise|means|in order to|to avoid|to keep)\b|^\s*(//|#|\*)\s*[a-z]'
  why: >-
    "Updated to use the new API" tells the next reader what happened one
    afternoon, not what the code does. The edit it describes is in the history
    already, and the comment outlives the moment it made sense — six months on
    it is describing a change against a version nobody remembers.
  fix: >-
    Say why the code is the way it is, or delete the line. If the change needs
    explaining, the commit message is where the explanation belongs and where
    it stays attached to the diff.

- id: signature-restating-docstring
  kind: slop
  title: A docstring that reads the signature back
  category: craft
  severity: low
  weight: 52
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-08" }
  channels: [source]
  source:
    patterns:
      - '/\*\*\s*\n\s*\*\s*(Gets?|Sets?|Returns?|Creates?|Handles?|Processes?|Exports?|Imports?|Updates?|Deletes?|Fetches|Builds?|Runs?|Sends?|Loads?|Saves?) the \w+\.?\s*\n\s*\*\s*@(returns?|param)'
      # Two shapes of the same line. JSDoc with a type — `@param {string} format
      # The format` — and without one, which is what TypeScript writes because
      # the type is already in the signature. Both are matched, so a
      # TypeScript codebase can trip this rule too.
      - '@param\s+\{\w+\}\s+(\w+)\s+[Tt]he\s+\1\b'
      - '@param\s+(\w+)\s+[Tt]he\s+\1\b'
      - '@returns?\s+[Tt]he\s+(result|value|output|data|response)\.?\s*$'
  why: >-
    "Gets the name. @returns the name" costs a reader four lines to learn what
    the signature already told them in one. It is the shape a docstring takes
    when something had to fill the slot.
  fix: >-
    Document what the signature cannot say: the units, the failure mode, the
    thing the caller has to have done first. If there is nothing like that,
    leave it undocumented — the name is doing the work.

- id: stub-shipped
  kind: quality
  title: A placeholder left in the shipped path
  category: craft
  severity: high
  weight: 79
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-13" }
  channels: [source]
  source:
    patterns:
      - "throw new (Error|TypeError)\\((['\"`])(Not implemented|not implemented|TODO|Unimplemented|unimplemented)"
      - '(//|#)\s*(TODO|FIXME|XXX|HACK)\s*[::-]?\s*(implement|finish|write|complete|handle)\b'
      - '\breturn\s+(null|undefined|\{\}|\[\]);?\s*(//|#)\s*(TODO|FIXME|placeholder|stub|for now)\b'
      - '(//|#)\s*(placeholder|stub|dummy|mock) (implementation|value|data|response)\b'
  why: >-
    A stub that throws is honest in development and a crash in production. A
    stub that returns an empty array is worse: it is indistinguishable from a
    real answer, so nothing fails and the wrong number reaches whoever was
    counting on it.
  fix: >-
    Finish it, or make it fail loudly at the boundary with the name of what is
    missing. A silent empty return is the one option that costs someone a
    debugging session.

- id: swallowed-error
  kind: quality
  title: A catch that hides what it caught
  category: craft
  severity: high
  weight: 74
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-02" }
    - { origin: catalogue, ref: "code:CODE-15" }
  channels: [source]
  source:
    patterns:
      # Genuinely empty, and an empty except.
      - 'catch\s*(\([^)]*\))?\s*\{\s*\}'
      - 'except\s+\w*\s*:\s*\n\s+pass\b'
      # A comment that gives no reason. The fix below says a caught error with a
      # stated reason is a decision, so a block carrying one has to pass:
      # `catch (e) { /* cross-origin stylesheet */ }` is a decision. Same rule
      # as redpen-ignore: the reason is what makes it a
      # decision, and three words is the floor for one.
      - 'catch\s*(\([^)]*\))?\s*\{\s*(//|/\*)\s*(ignore|noop|no-op|nothing|skip|empty|pass|swallow)?d?\s*(\*/)?\s*\n?\s*\}'
      # Logging is not handling. The console call need not be the only
      # statement in the block: `catch (e) { console.log(e); return ""; }` is
      # the commonest shape there is.
      - 'catch\s*\([^)]*\)\s*\{\s*console\.(log|debug|info)\([^)]*\);?\s*(\n\s*)?(return[^;\n]*;?\s*)?\}'
    # A reason in the comment above is still a reason. `try { await refresh(); }
    # catch {}` under "Swallow a refresh failure so the error surface below
    # always fires" is a better justification than most code carries inside
    # the block.
    suppress: '\b(because|so that|so the|so it|otherwise|expected|deliberate|intentional|on purpose|safe to)\b|\bSwallow\b'
    suppressLines: 4
  why: >-
    An empty catch turns a failure into silence. The program continues in a
    state nobody designed, and the first sign of it is a wrong number somewhere
    else entirely, hours later, with nothing in the log to connect them.
  fix: >-
    Handle it, or let it propagate. If it is genuinely ignorable, say which
    error and why in the block — a caught exception with a reason is a decision,
    an empty block is an omission.

- id: defensive-impossible-check
  kind: slop
  title: A guard against something that cannot happen
  category: craft
  severity: low
  weight: 48
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-04" }
  channels: [source]
  source:
    patterns:
      - 'if\s*\(\s*typeof\s+\w+\s*===\s*[''"]undefined[''"]\s*\)\s*\{\s*\w+\s*=\s*(\[\]|\{\}|0|[''"]{2})'
      # "defensive" on its own is gone. It matched
      # `// this is load-bearing, not\n// defensive padding` — a comment arguing
      # the exact opposite of the finding, with the negation on the line above
      # where a same-line suppression cannot see it. A word that reads the same
      # asserted and denied is not a signal.
      - '(//|#)\s*(just in case|belt and braces|should never happen|shouldn''t happen)\b'
      # `if (!Array.isArray(x)) return []` is deliberately not matched. It is
      # how code narrows an `unknown`, from JSON.parse or from a parameter
      # declared `unknown`. That is not a defensive check, it is the only way to
      # touch the value at
      # all, and this rule's own fix text calls guarding at the edge correct.
      # A regex cannot see the declared type, so it cannot tell the two apart,
      # and a false positive here sends someone to delete a guard they need.
  why: >-
    A check for a value the type system already rules out reads as uncertainty
    about the code around it. It also hides the real bug: if that value ever
    does arrive, the guard turns a crash you could trace into a default you
    cannot.
  fix: >-
    Trust the type, or fix the boundary where the value actually enters. Guard
    at the edge, once, where untrusted input arrives — not at every function it
    passes through afterwards.

- id: grandiose-identifier
  kind: slop
  title: A marketing adjective in a name
  category: craft
  severity: medium
  weight: 61
  evidenceRank: null
  sources:
    - { origin: redpen, ref: naming-residue }
    - { origin: catalogue, ref: "code:CODE-14" }
  channels: [source]
  source:
    paths:
      # Not test files. `advanced_test.go` is Go grouping its harder cases, and
      # the adjective there qualifies the tests rather than the code.
      - '(^|/)(enhanced|improved|advanced|optimi[sz]ed|robust|smart|powerful|comprehensive|seamless|ultimate|super)[-_](?!test\.|spec\.)[\w-]+\.(?<!\.test\.)(?<!\.spec\.)[a-z]+$'
    patterns:
      - '\b(function|const|let|var|class|def|func|type|interface)\s+(enhanced|improved|advanced|optimi[sz]ed|robust|smart|powerful|comprehensive|seamless|ultimate)[A-Z_]\w*'
      - '\b(enhanced|improved|advanced|optimi[sz]ed|robust|smart|comprehensive)(Version|Handler|Manager|Processor|Wrapper|Service|Helper|Util|Parser|Formatter)\b'
    caseSensitive: true
  why: >-
    Nobody sits down to write `enhancedDataProcessor`. The adjective is there
    because something had to distinguish this from a previous attempt, and it
    describes the author's opinion of the code rather than what the code does —
    which leaves the next reader with no way to guess what is inside it.
  fix: >-
    Name it for the difference. If it is enhanced relative to something, the
    thing that changed is the name: `retryingFetch` rather than `robustFetch`,
    `streamingParser` rather than `advancedParser`.

- id: placeholder-identifier
  kind: quality
  title: A name from the tutorial it was copied out of
  category: craft
  severity: medium
  weight: 67
  evidenceRank: null
  sources:
    - { origin: redpen, ref: naming-residue }
    - { origin: catalogue, ref: "code:CODE-13" }
  channels: [source]
  source:
    patterns:
      # Not `new`, `test` or `temp`. newX() is the Go constructor idiom and a JS
      # factory convention (`newToken`, `newCompileCmd`), and `tempDir` and
      # `testService` are test helpers named exactly right. What is left is the
      # set nobody chooses on purpose. Not `sample` either: it is a real word
      # doing real work — sampleProfile takes samples along a path,
      # sampleTemplates returns sample templates.
      - '\b(function|const|let|var|class|def|func|type|interface)\s+(my|example|demo|foo|bar|baz|qux)[A-Z]\w*'
      - '\b(function|def|func)\s+(doSomething|doStuff|handleIt|myFunction|newFunction|exampleFunction|testFunction)\b'
      - '\b(const|let|var)\s+(data|result|temp|obj|item|thing|stuff|value)[0-9]\b'
    caseSensitive: true
  why: >-
    `myHandler`, `exampleService`, `doSomething`, `data2`. These are the names a
    thing gets before anyone knows what it is, and they survive because the code
    works — so the file ends up describing a tutorial rather than the system it
    became part of.
  fix: >-
    Name it for what it does in this system. If that is genuinely hard to say,
    the difficulty is usually the code rather than the name.

- id: junk-drawer-module
  kind: slop
  title: Several modules named after nothing
  category: craft
  severity: medium
  weight: 57
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-05" }
    - { origin: redpen, ref: naming-residue }
  channels: [source]
  source:
    # Matched on the basename so each drawer counts once. A directory pattern
    # would count every file inside `utils/` and report one drawer as thirty.
    paths:
      - '(^|/)(utils?|helpers?|common|misc|shared|stuff|extras|things|constants)\.(ts|tsx|js|jsx|mjs|cjs|go|py|rb|rs|java|kt|php|cs)$'
    # One utils.ts is where a project keeps the two functions that fit nowhere,
    # and that is fine. Three of them is a filing system nobody designed: the
    # question "where does this go" now has three answers and no reason to
    # prefer any of them.
    minHits: 3
  why: >-
    A module named for what it is not — not a parser, not a client, not a store —
    accumulates whatever had nowhere else to go. Several of them means the
    question "where does this belong" has stopped having an answer, and the next
    function lands in whichever one the author opened last.
  fix: >-
    Name each one for what it actually holds. Most junk drawers turn out to be
    two or three real modules that were never separated: dates, formatting, and
    a client wrapper, filed together because they arrived on the same afternoon.

# ---------------------------------------------------------------------------
# Added from code-slop CODE-03, 06, 09, 10, 12, cross-referenced against the
# structural-smell tooling that damu-adjacent cleanup plugins reach for and,
# where one exists, an empirical measurement. CODE-07, CODE-11 and CODE-16 are
# deliberately absent: 07 lives in test files, which the walk skips before any
# rule sees them, and 11 and 16 need a syntax tree rather than a pattern.
# ---------------------------------------------------------------------------

- id: weak-type-escape
  kind: slop
  title: Types widened to quiet the compiler
  category: craft
  severity: medium
  weight: 64
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-03" }
    - { origin: heuristics, ref: "type-strengthen" }
  channels: [source]
  source:
    # Three, not one. A codebase is entitled to a handful of genuine boundaries
    # — a freshly parsed body, a dynamic dispatch — and firing on the first one
    # would report the boundary rather than the habit.
    minHits: 3
    # Only the languages that have a widening escape hatch. Without this the
    # rule read `# same as any other failure` in a shell script and called an
    # English sentence a type annotation.
    extensions: ['.ts', '.tsx', '.py', '.java', '.cs']
    caseSensitive: true
    patterns:
      #
      # Measured and rejected: Go's `interface{}`.
      #
      # On a 1,872-file Go repository every hit was the language rather than a
      # habit — `var obj map[string]interface{}` unmarshalling arbitrary JSON,
      # and `func walkAllStrings(obj interface{})` fronting a type switch. Both
      # are the only way Go expresses those, so the rule was firing on Go. A
      # signal present in every member of the population is not a signal.
      #
      # TypeScript keeps its patterns because `unknown` is a real alternative
      # there: it narrows, and `any` is the choice not to.
      - '\bas\s+any\b'
      - ':\s*any\s*(\[\])?\s*[,;)=>}]'
      - '\bDict\[str,\s*Any\]'
      - ':\s*Any\s*[,)=]'
      - '<\s*any\s*>'
    # Three suppressions, all of them from one Go repository of 1,872 files.
    #
    # A comment is not a type. `// structToMap converts a reflect.Value to a
    # map[string]interface{}` is a sentence explaining a signature, and
    # `// is NOT recorded as any other manifest's` is English — the same
    # "as any" that a shell script produced before extensions were narrowed.
    # Craft rules read comments on purpose, so the skip has to be written here.
    #
    # And `any` inside a .d.ts is describing someone else's library.
    suppress: '^\s*(//|#|\*|/\*)|\.d\.ts$|\b(ComponentType|FC|FunctionComponent|Component)<'
  why: >-
    A widened type is a type error that was in the way. It moves the failure
    from the compiler, which would have named the line, to runtime, which will
    name something three calls away — and it does it silently, so nobody
    revisits the decision.
  fix: >-
    Find the real type by reading what produces the value, not what consumes
    it. Where the value genuinely is unknown, say `unknown` and narrow it at
    the point of use, so the check is written down rather than assumed.

- id: long-parameter-list
  kind: slop
  title: A signature that takes everything it might ever need
  category: craft
  severity: medium
  weight: 61
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-06" }
    - { origin: study, ref: "llm-smell-taxonomy" }
  channels: [source]
  source:
    patterns:
      # Six or more parameters on one signature. Anticipating every use is
      # cheaper to generate than choosing one, and the measured shape of LLM
      # code is long parameter lists carrying context that deep nesting then
      # consumes.
      #
      # Brackets, braces and angle brackets are excluded from a parameter
      # segment on purpose. Without that, `compare(x: [number, number, number],
      # y: [number, number, number])` counts its tuple commas and reports a
      # two-parameter function as a six-parameter one.
      - '\b(function|def)\s+\w+\s*\(\s*(?:[^()\[\]{}<>]*?,\s*){5,}[^()\[\]{}<>]*?\)'
      # Four or more optional parameters is an options bag written as a
      # signature: every call site passes a different subset and none of them
      # passes all of it.
      - '\([^()\[\]{}<>]*?(?:\w+\?:[^,()\[\]{}<>]+,\s*){3,}\w+\?:[^,()\[\]{}<>]+\)'
  why: >-
    Six parameters is a function that was never asked what it is for. Each one
    is a decision deferred to the caller, and the callers do not agree — which
    is why most of them are optional and most of those are never passed.
  fix: >-
    Parameters for what actually varies between call sites, and nothing else.
    If two callers want genuinely different things, that is two functions
    wearing one name.

- id: rewritten-standard-library
  kind: slop
  title: A utility the runtime already ships
  category: craft
  severity: low
  weight: 55
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-09" }
    - { origin: heuristics, ref: "dedup" }
  channels: [source]
  source:
    patterns:
      # Named for what it is, because that is the tell: a hand-rolled `groupBy`
      # is recognisable precisely because it took the standard name.
      #
      # Only names with a real standard equivalent to be a duplicate *of*.
      # `sleep`, `clamp`, `debounce` and `slugify` are not in any of these
      # runtimes, so a local one is the only one there can be, and
      # `const sleep = ms => ...` is honest code.
      #
      # And the right-hand side has to look like a function. `const pick =
      # features.find(f => ...)` is a variable that happens to share a name
      # with a lodash helper.
      - '\b(function|export function)\s+(groupBy|deepClone|structuredClone|flatten|uuidv4|randomUUID)\s*[(<]'
      - '\b(const|let|export const)\s+(groupBy|deepClone|flatten|uuidv4)\s*=\s*(\(|function\b|async\b)'
      - '\bdef\s+(group_by|deep_clone|flatten)\s*\('
    # A re-export or a typed wrapper over the real one is not a reimplementation.
    suppress: '\b(from|require|import)\b'
  why: >-
    `structuredClone`, `Object.groupBy`, `crypto.randomUUID` and
    `Array.prototype.flat` already exist and are already correct. A hand-rolled
    copy is a second implementation to keep right, and the ones that get
    written from memory are usually subtly wrong at the edges — empty input,
    sparse arrays, prototype keys.
  fix: >-
    Use the built-in. If you need behaviour it does not have, keep the local
    one but say in a line above it what the difference is, so the next reader
    does not delete it as a duplicate.

- id: named-magic-number
  kind: slop
  title: A magic number with a comment where a name belongs
  category: craft
  severity: low
  weight: 51
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-10" }
    - { origin: heuristics, ref: "naming" }
  channels: [source]
  source:
    # Case-sensitive, because the suppression below turns on a name being
    # SCREAMING_CASE, and under the `i` flag `const food` looked like one —
    # which silenced the rule on the very lines it was written for.
    caseSensitive: true
    patterns:
      # The literal and its explanation generated together. The comment proves
      # the author knew the number needed a name, and wrote the name in the one
      # place nothing can reference it.
      #
      # Bare number words are out. `# two spur lines running N-S` describes a
      # shape, not a limit, and "two" would report an array index as an unnamed
      # constant.
      # What survives is the vocabulary of a limit or a unit, opening the
      # comment rather than appearing anywhere in it.
      - '\b\d{2,}\b[^\n]{0,24}(//|#)\s*[Mm]ax\b'
      - '\b\d{2,}\b[^\n]{0,24}(//|#)\s*[Mm]in\b'
      - '\b\d{2,}\b[^\n]{0,24}(//|#)\s*([Dd]efault|[Ll]imit|[Tt]imeout|[Rr]etries|[Tt]hreshold|[Cc]ap)\b'
      - '\b\d{3,}\b[^\n]{0,24}(//|#)\s*\w{0,6}\s*([Ss]econds?|[Mm]inutes?|[Hh]ours?|[Dd]ays?|[Ww]eeks?|ms|[Mm]illiseconds?)\b'
      - '(setTimeout|setInterval)\s*\([^,)]*,\s*\d{4,}\s*\)\s*(//|#)'
    # A line that already declares the constant has done what this rule asks
    # for. `const MAX_IDS = 1000; // cap array-of-ids fields` is named, and the
    # comment is explaining the cap rather than standing in for a name.
    #
    # `staleTime: 5 * 60 * 1000, // 5 minutes` is the shape this rule is asking
    # for — the arithmetic spells the unit out and the comment confirms it. So
    # is a digit inside a quoted string:
    # `"capi-ubun2-2404", // default` is a version, not a limit.
    suppress: '\b(const|final|static|let|var|#define)\s+[A-Z][A-Z0-9_]{2,}\s*[=:]|(^|\n)\s*[A-Z][A-Z0-9_]{2,}\s*[=:]|\d\s*\*\s*\d|["\x27][^"\x27]*\d[^"\x27]*["\x27]'
  why: >-
    `if (retries > 3) // max retries` puts the name in a comment, where nothing
    can reference it and nothing will update it. The second place that needs
    the same number will get its own literal, and the two will drift.
  fix: >-
    Name it once as a constant and use the name. The comment then has something
    to be about, or turns out to have been unnecessary.

- id: barrel-file
  kind: slop
  title: An index file that only forwards
  category: craft
  severity: low
  weight: 48
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-12" }
    - { origin: heuristics, ref: "circular-deps" }
  channels: [source]
  source:
    paths:
      - '(^|/)index\.[cm]?[jt]sx?$'
    patterns:
      # `^` is the start of the file, not of a line: patterns compile with `gu`
      # and never `m`, so an anchored pattern matches once at most. A newline
      # class is the line anchor that actually works here.
      #
      # Only the star form. `export { StatusBadge } from './StatusBadge'` names
      # what it forwards, so the graph is still readable and the importer still
      # resolves one file — that shape is a directory's public surface, and a
      # components directory is entitled to one. `export *` is the form that
      # makes every importer transitively import every sibling.
      - '(^|\n)\s*export\s+\*\s+from\s'
    # One or two forwards is a module boundary. Five is a file that exists to
    # save an import path and costs a cycle to resolve.
    minHits: 5
  why: >-
    A barrel re-exporting five modules buys a shorter import and sells the
    ability to see what depends on what. It is also the most common way a
    circular dependency gets introduced without anyone writing one, because
    every importer now transitively imports every sibling.
  fix: >-
    Import from the module that defines the thing. Keep a barrel only where it
    is a real public surface — a package entry point — and not as a convenience
    over a handful of files in the same directory.

# ---------------------------------------------------------------------------
# The three tells that need a parse of the whole project rather than a pattern.
# Each is produced by an analyser the project already carries — see
# src/channels/tools.ts — and none of them runs unless that analyser is present.
# ---------------------------------------------------------------------------

- id: copy-paste-duplication
  kind: slop
  title: Blocks repeated instead of shared
  category: craft
  severity: high
  weight: 77
  evidenceRank: null
  sources:
    - { origin: study, ref: "gitclear:block-duplication" }
    - { origin: heuristics, ref: "dedup" }
  channels: [tools]
  # The industry figures are deliberately not in `why`.
  #
  # `why` is printed directly under the finding, so a sentence about 623
  # million changes across every codebase read as a claim about *this* one —
  # the first person to see it asked whether redpen thought their repository
  # had millions of commits and three years of history. The provenance line
  # carries the study; the argument has to be about the code in front of you.
  why: >-
    A second copy is cheaper to write than a shared function is to find, and
    the cost lands on whoever has to change both — usually months later,
    usually someone who does not know the other copy exists. It is the tell
    that best separates code that was generated from code that was maintained,
    because generating is cheap and consolidating never happens by itself.
  fix: >-
    Extract the block once both copies are in front of you, so you can see what
    actually varies between them. Two blocks that differ in one literal want a
    parameter; two that differ in their middle want two functions.

- id: circular-dependency
  kind: quality
  title: Modules that import each other
  category: craft
  severity: medium
  weight: 63
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "circular-deps" }
    - { origin: catalogue, ref: "code:CODE-12" }
  channels: [tools]
  why: >-
    A cycle means neither module can be understood, tested or loaded without
    the other. Most are introduced by accident — a barrel file, or a type
    pulled back across a boundary — and they surface as an undefined value at
    import time, which is the hardest failure in the language to read.
  fix: >-
    Move what both need into a third module that depends on neither. Breaking
    the cycle by adding an interface only hides it behind one more file.

- id: unused-export
  kind: quality
  title: Exports nothing imports
  category: craft
  severity: low
  weight: 47
  evidenceRank: null
  sources:
    - { origin: heuristics, ref: "dead-code" }
    - { origin: catalogue, ref: "code:CODE-13" }
  channels: [tools]
  why: >-
    An export with no importer is a public surface nobody asked for. It has to
    be kept compiling, it turns up in every rename, and it makes the module
    look like it has a wider contract than it has.
  fix: >-
    Delete it, or make it local. Anything genuinely kept for a future caller
    wants a line saying so, or the next reader deletes it anyway.
