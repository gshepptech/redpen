# Code that reads as machine-written.
#
# Source channel only, and outside a UI scan on purpose: a page's markup and a
# project's source are different questions, and folding them together would
# change every score anyone holds a baseline for. `redpen code` runs these.
#
# Every rule here is about the shape of the writing, never about whether the
# code works. A comment that narrates an edit is not a bug; it is a sentence
# addressed to whoever was reviewing that afternoon, left in a file that will
# outlive them.

- id: edit-narrating-comment
  kind: slop
  title: A comment addressed to the reviewer, not the reader
  category: craft
  severity: medium
  weight: 68
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-01" }
  channels: [source]
  source:
    patterns:
      # Past tense about the author's own edit. Gerunds are out: "Adding a fifth
      # advisory means adding a row here" is an instruction to whoever comes
      # next, not a note about what happened. "Fixed" is out too — it is more
      # often "fixed order" or "fixed width" than "I fixed it", and it cost this
      # rule a false positive on `// Fixed, not the marks' insertion order`.
      - '(//|#|\*)\s*(Added|Updated|Changed|Removed|Refactored|Renamed|Moved|Replaced)\b[^\n]{0,60}\b(here|above|below|this|to (use|be|match|support)|from|for (now|clarity|consistency))\b'
      - '(//|#|\*)\s*(NEW|OLD|WAS|BEFORE|AFTER)\s*[::-]'
      - '(//|#|\*)\s*(As (requested|discussed|per)|Per (the|your) (request|feedback|review))\b'
      - '(//|#|\*)\s*(This (was|has been) (added|updated|changed|refactored))\b'
    # A clause giving the reason makes it an explanation rather than a diary
    # entry. `// Added here (before Terra Draw) so it sits beneath the outlines`
    # narrates an edit and also says why the order matters, and the why is the
    # part worth keeping.
    # Two suppressions, both learned from real comments.
    #
    # A clause giving the reason makes it an explanation rather than a diary
    # entry: `// Added here (before Terra Draw) so it sits beneath the outlines`
    # narrates an edit and also says why the order matters, and the why is the
    # part worth keeping.
    #
    # And a line starting lower-case is the middle of a sentence, not the start
    # of a note. Patterns compile case-insensitively, so "Whitetail Institute
    # renamed this product" and "a field added to a type in lib/types.ts" both
    # matched on their continuation lines — two of the better comments in that
    # codebase, reported for containing a verb.
    caseSensitive: true
    suppress: '\b(because|so that|so it|so the|which is|otherwise|means|in order to|to avoid|to keep)\b|^\s*(//|#|\*)\s*[a-z]'
  why: >-
    "Updated to use the new API" tells the next reader what happened one
    afternoon, not what the code does. The edit it describes is in the history
    already, and the comment outlives the moment it made sense — six months on
    it is describing a change against a version nobody remembers.
  fix: >-
    Say why the code is the way it is, or delete the line. If the change needs
    explaining, the commit message is where the explanation belongs and where
    it stays attached to the diff.

- id: signature-restating-docstring
  kind: slop
  title: A docstring that reads the signature back
  category: craft
  severity: low
  weight: 52
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-08" }
  channels: [source]
  source:
    patterns:
      - '/\*\*\s*\n\s*\*\s*(Gets?|Sets?|Returns?|Creates?|Handles?|Processes?|Exports?|Imports?|Updates?|Deletes?|Fetches|Builds?|Runs?|Sends?|Loads?|Saves?) the \w+\.?\s*\n\s*\*\s*@(returns?|param)'
      # Two shapes of the same line. JSDoc with a type — `@param {string} format
      # The format` — and without one, which is what TypeScript writes because
      # the type is already in the signature. Only the first was matched, so a
      # TypeScript codebase could not trip this rule at all.
      - '@param\s+\{\w+\}\s+(\w+)\s+[Tt]he\s+\1\b'
      - '@param\s+(\w+)\s+[Tt]he\s+\1\b'
      - '@returns?\s+[Tt]he\s+(result|value|output|data|response)\.?\s*$'
  why: >-
    "Gets the name. @returns the name" costs a reader four lines to learn what
    the signature already told them in one. It is the shape a docstring takes
    when something had to fill the slot.
  fix: >-
    Document what the signature cannot say: the units, the failure mode, the
    thing the caller has to have done first. If there is nothing like that,
    leave it undocumented — the name is doing the work.

- id: stub-shipped
  kind: quality
  title: A placeholder left in the shipped path
  category: craft
  severity: high
  weight: 79
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-13" }
  channels: [source]
  source:
    patterns:
      - "throw new (Error|TypeError)\\((['\"`])(Not implemented|not implemented|TODO|Unimplemented|unimplemented)"
      - '(//|#)\s*(TODO|FIXME|XXX|HACK)\s*[::-]?\s*(implement|finish|write|complete|handle)\b'
      - '\breturn\s+(null|undefined|\{\}|\[\]);?\s*(//|#)\s*(TODO|FIXME|placeholder|stub|for now)\b'
      - '(//|#)\s*(placeholder|stub|dummy|mock) (implementation|value|data|response)\b'
  why: >-
    A stub that throws is honest in development and a crash in production. A
    stub that returns an empty array is worse: it is indistinguishable from a
    real answer, so nothing fails and the wrong number reaches whoever was
    counting on it.
  fix: >-
    Finish it, or make it fail loudly at the boundary with the name of what is
    missing. A silent empty return is the one option that costs someone a
    debugging session.

- id: swallowed-error
  kind: quality
  title: A catch that hides what it caught
  category: craft
  severity: high
  weight: 74
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-02" }
    - { origin: catalogue, ref: "code:CODE-15" }
  channels: [source]
  source:
    patterns:
      # Genuinely empty, and an empty except.
      - 'catch\s*(\([^)]*\))?\s*\{\s*\}'
      - 'except\s+\w*\s*:\s*\n\s+pass\b'
      # A comment that gives no reason. The fix below says a caught error with a
      # stated reason is a decision, so a block carrying one has to pass — the
      # first version of this fired on redpen's own
      # `catch (e) { /* cross-origin stylesheet */ }`, contradicting its own
      # advice. Same rule as redpen-ignore: the reason is what makes it a
      # decision, and three words is the floor for one.
      - 'catch\s*(\([^)]*\))?\s*\{\s*(//|/\*)\s*(ignore|noop|no-op|nothing|skip|empty|pass|swallow)?d?\s*(\*/)?\s*\n?\s*\}'
      # Logging is not handling. The pattern used to need the console call to be
      # the only statement in the block, so `catch (e) { console.log(e); return
      # ""; }` — the commonest shape there is — went unreported.
      - 'catch\s*\([^)]*\)\s*\{\s*console\.(log|debug|info)\([^)]*\);?\s*(\n\s*)?(return[^;\n]*;?\s*)?\}'
    # A reason in the comment above is still a reason. This rule reported
    # `try { await refresh(); } catch {}` on a project where the three lines
    # above it say "Swallow a refresh failure so the error surface below always
    # fires" — which is a better justification than most code carries inside
    # the block.
    suppress: '\b(because|so that|so the|so it|otherwise|expected|deliberate|intentional|on purpose|safe to)\b|\bSwallow\b'
    suppressLines: 4
  why: >-
    An empty catch turns a failure into silence. The program continues in a
    state nobody designed, and the first sign of it is a wrong number somewhere
    else entirely, hours later, with nothing in the log to connect them.
  fix: >-
    Handle it, or let it propagate. If it is genuinely ignorable, say which
    error and why in the block — a caught exception with a reason is a decision,
    an empty block is an omission.

- id: defensive-impossible-check
  kind: slop
  title: A guard against something that cannot happen
  category: craft
  severity: low
  weight: 48
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-04" }
  channels: [source]
  source:
    patterns:
      - 'if\s*\(\s*typeof\s+\w+\s*===\s*[''"]undefined[''"]\s*\)\s*\{\s*\w+\s*=\s*(\[\]|\{\}|0|[''"]{2})'
      # "defensive" on its own is gone. It matched
      # `// this is load-bearing, not\n// defensive padding` — a comment arguing
      # the exact opposite of the finding, with the negation on the line above
      # where a same-line suppression cannot see it. A word that reads the same
      # asserted and denied is not a signal.
      - '(//|#)\s*(just in case|belt and braces|should never happen|shouldn''t happen)\b'
      # `if (!Array.isArray(x)) return []` was here and is gone. On the first
      # real codebase it fired three times, every one of them narrowing an
      # `unknown` — from JSON.parse, and from a parameter declared `unknown`.
      # That is not a defensive check, it is the only way to touch the value at
      # all, and this rule's own fix text calls guarding at the edge correct.
      # A regex cannot see the declared type, so it cannot tell the two apart,
      # and a false positive here sends someone to delete a guard they need.
  why: >-
    A check for a value the type system already rules out reads as uncertainty
    about the code around it. It also hides the real bug: if that value ever
    does arrive, the guard turns a crash you could trace into a default you
    cannot.
  fix: >-
    Trust the type, or fix the boundary where the value actually enters. Guard
    at the edge, once, where untrusted input arrives — not at every function it
    passes through afterwards.

- id: grandiose-identifier
  kind: slop
  title: A marketing adjective in a name
  category: craft
  severity: medium
  weight: 61
  evidenceRank: null
  sources:
    - { origin: redpen, ref: naming-residue }
    - { origin: catalogue, ref: "code:CODE-14" }
  channels: [source]
  source:
    paths:
      # Not test files. `advanced_test.go` is Go grouping its harder cases, and
      # the adjective there qualifies the tests rather than the code.
      - '(^|/)(enhanced|improved|advanced|optimi[sz]ed|robust|smart|powerful|comprehensive|seamless|ultimate|super)[-_](?!test\.|spec\.)[\w-]+\.(?<!\.test\.)(?<!\.spec\.)[a-z]+$'
    patterns:
      - '\b(function|const|let|var|class|def|func|type|interface)\s+(enhanced|improved|advanced|optimi[sz]ed|robust|smart|powerful|comprehensive|seamless|ultimate)[A-Z_]\w*'
      - '\b(enhanced|improved|advanced|optimi[sz]ed|robust|smart|comprehensive)(Version|Handler|Manager|Processor|Wrapper|Service|Helper|Util|Parser|Formatter)\b'
    caseSensitive: true
  why: >-
    Nobody sits down to write `enhancedDataProcessor`. The adjective is there
    because something had to distinguish this from a previous attempt, and it
    describes the author's opinion of the code rather than what the code does —
    which leaves the next reader with no way to guess what is inside it.
  fix: >-
    Name it for the difference. If it is enhanced relative to something, the
    thing that changed is the name: `retryingFetch` rather than `robustFetch`,
    `streamingParser` rather than `advancedParser`.

- id: placeholder-identifier
  kind: quality
  title: A name from the tutorial it was copied out of
  category: craft
  severity: medium
  weight: 67
  evidenceRank: null
  sources:
    - { origin: redpen, ref: naming-residue }
    - { origin: catalogue, ref: "code:CODE-13" }
  channels: [source]
  source:
    patterns:
      # `new`, `test` and `temp` are gone. newX() is the Go constructor idiom and
      # a JS factory convention — `newToken`, `newCompileCmd`, `newPropertyId`,
      # `newTestFlagSet` were every hit on four real codebases and every one was
      # ordinary code. `tempDir` and `testService` are test helpers named
      # exactly right. What is left is the set nobody chooses on purpose.
      # `sample` is gone too. It is a real word doing real work — sampleProfile
      # takes samples along a path, sampleTemplates returns sample templates —
      # and it was wrong both times it fired on real code.
      - '\b(function|const|let|var|class|def|func|type|interface)\s+(my|example|demo|foo|bar|baz|qux)[A-Z]\w*'
      - '\b(function|def|func)\s+(doSomething|doStuff|handleIt|myFunction|newFunction|exampleFunction|testFunction)\b'
      - '\b(const|let|var)\s+(data|result|temp|obj|item|thing|stuff|value)[0-9]\b'
    caseSensitive: true
  why: >-
    `myHandler`, `exampleService`, `doSomething`, `data2`. These are the names a
    thing gets before anyone knows what it is, and they survive because the code
    works — so the file ends up describing a tutorial rather than the system it
    became part of.
  fix: >-
    Name it for what it does in this system. If that is genuinely hard to say,
    the difficulty is usually the code rather than the name.

- id: junk-drawer-module
  kind: slop
  title: Several modules named after nothing
  category: craft
  severity: medium
  weight: 57
  evidenceRank: null
  sources:
    - { origin: catalogue, ref: "code:CODE-05" }
    - { origin: redpen, ref: naming-residue }
  channels: [source]
  source:
    # Matched on the basename so each drawer counts once. A directory pattern
    # would count every file inside `utils/` and report one drawer as thirty.
    paths:
      - '(^|/)(utils?|helpers?|common|misc|shared|stuff|extras|things|constants)\.(ts|tsx|js|jsx|mjs|cjs|go|py|rb|rs|java|kt|php|cs)$'
    # One utils.ts is where a project keeps the two functions that fit nowhere,
    # and that is fine. Three of them is a filing system nobody designed: the
    # question "where does this go" now has three answers and no reason to
    # prefer any of them.
    minHits: 3
  why: >-
    A module named for what it is not — not a parser, not a client, not a store —
    accumulates whatever had nowhere else to go. Several of them means the
    question "where does this belong" has stopped having an answer, and the next
    function lands in whichever one the author opened last.
  fix: >-
    Name each one for what it actually holds. Most junk drawers turn out to be
    two or three real modules that were never separated: dates, formatting, and
    a client wrapper, filed together because they arrived on the same afternoon.
